    <text x="268" y="689" font-size="13" fill="#8E837A">Inclua objetivos mensuráveis e referências para uma aula realmente sua.</text>
    <rect x="268" y="712" width="530" height="96" rx="12" fill="#fff" stroke="#E4DDD6"/>
    <text x="292" y="739" font-size="11" fill="#9B9087" font-weight="700" letter-spacing=".7">OBJETIVOS DE APRENDIZAGEM</text>
    <text x="292" y="766" font-size="14" fill="#4A4643">• Narrar experiências com clareza</text>
    <text x="292" y="789" font-size="14" fill="#4A4643">• Usar conectores de sequência</text>
    <rect x="816" y="712" width="548" height="96" rx="12" fill="#fff" stroke="#E4DDD6"/>
    <text x="840" y="739" font-size="11" fill="#9B9087" font-weight="700" letter-spacing=".7">MATERIAIS DE APOIO</text>
