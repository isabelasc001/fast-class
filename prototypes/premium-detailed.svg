    <text x="292" y="492" font-size="15" fill="#4A4643">Travel experiences: speaking with confidence</text>
    <rect x="816" y="439" width="548" height="76" rx="10" fill="#fff" stroke="#E4DDD6"/>
    <text x="840" y="465" font-size="11" fill="#9B9087" font-weight="700" letter-spacing=".7">METODOLOGIA</text>
    <text x="840" y="492" font-size="15" fill="#4A4643">Aprendizagem baseada em projetos</text>
