    <text x="292" y="564" font-size="11" fill="#9B9087" font-weight="700" letter-spacing=".7">CONTEXTO DA TURMA</text>
    <text x="292" y="591" font-size="14" fill="#4A4643">Adultos B1, 12 alunos; precisam praticar narrativas no passado para uma viagem.</text>
