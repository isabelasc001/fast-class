    <text x="268" y="183" font-family="Georgia, serif" font-size="38" fill="#403B38">Desenhe a aula com mais profundidade.</text>
    <text x="268" y="211" font-size="15" fill="#8B8179">Adicione contexto, objetivos e materiais para uma experiência mais personalizada.</text>
