    <text x="346" y="307" font-size="13" fill="#6F655E">Rápido de preencher, simples de revisar e ideal para começar.</text>
    <text x="1260" y="294" text-anchor="end" font-size="12" fill="#8F4F42" font-weight="700">menos texto · mais agilidade</text>
