    <text x="268" y="137" font-size="12" fill="#9A9088" font-weight="700" letter-spacing="1.2">CRIAR AULA</text>
    <text x="268" y="183" font-family="Georgia, serif" font-size="38" fill="#403B38">Crie uma Onda em poucos passos.</text>
    <text x="268" y="211" font-size="15" fill="#8B8179">Defina o essencial, escolha a metodologia e deixe a IA montar o primeiro rascunho.</text>
