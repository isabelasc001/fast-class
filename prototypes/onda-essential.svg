    <text x="292" y="492" font-size="15" fill="#4A4643">Viagens e descobertas</text>
    <path d="M563 477l7 7 7-7" fill="none" stroke="#C66E59" stroke-width="2"/>
    <rect x="614" y="439" width="328" height="76" rx="10" fill="#fff" stroke="#E4DDD6"/>
    <text x="638" y="465" font-size="11" fill="#9B9087" font-weight="700" letter-spacing=".7">METODOLOGIA</text>
