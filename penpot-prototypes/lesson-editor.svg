<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#FAF7F2"/><rect width="240" height="900" fill="#F3EDE4"/><line x1="240" y1="0" x2="240" y2="900" stroke="#E9E4DE"/><line x1="240" y1="76" x2="1440" y2="76" stroke="#E9E4DE"/><g font-family="Inter,Arial,sans-serif" fill="#3B2923"><rect x="32" y="30" width="34" height="34" rx="11" fill="#B85C47"/><path d="M42 56V38h14v18M39 43h20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text x="78" y="51" font-size="16" font-weight="700">Gerador de Aulas</text><text x="32" y="113" font-size="10" font-weight="700" letter-spacing="1.5" fill="#77716C">WORKSPACE</text><rect x="16" y="136" width="208" height="42" rx="8" fill="#E9D4CB"/><text x="54" y="162" font-size="13" fill="#9A4F3D" font-weight="600">Última aula</text><text x="54" y="214" font-size="13" fill="#4A4643">Criar aula</text><text x="54" y="266" font-size="13" fill="#4A4643">Banco de questões</text><text x="32" y="764" font-size="11" fill="#77716C">Plano Professor</text><rect x="32" y="777" width="176" height="5" rx="3" fill="#DFD3C8"/><rect x="32" y="777" width="78" height="5" rx="3" fill="#D9823B"/><circle cx="48" cy="850" r="16" fill="#DFC0B1"/><text x="48" y="854" text-anchor="middle" font-size="11" font-weight="700" fill="#9A4F3D">IS</text><text x="74" y="849" font-size="12" font-weight="600">Isabela Santos</text><text x="280" y="45" font-size="12" fill="#77716C">Aulas</text><text x="323" y="45" font-size="12" fill="#CFC7BF">/</text><text x="340" y="45" font-size="12" font-weight="600">Travel experiences</text><circle cx="1354" cy="38" r="17" fill="#B85C47"/><text x="1354" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">IS</text></g><g transform="translate(280 105)" font-family="Inter,Arial,sans-serif"><text y="0" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9A4F3D">PLANO DE AULA · PRONTO PARA REVISÃO</text><text y="45" font-family="Georgia,serif" font-size="40" fill="#3B2923">Travel experiences</text><text y="74" font-size="12" fill="#77716C">Uma aula para falar sobre experiências pessoais usando o present perfect com confiança e contexto.</text><g transform="translate(0 95)"><rect width="72" height="22" rx="11" fill="#fff" stroke="#E9E4DE"/><text x="36" y="15" text-anchor="middle" font-size="10" fill="#77716C">Inglês</text><rect x="80" width="92" height="22" rx="11" fill="#fff" stroke="#E9E4DE"/><text x="126" y="15" text-anchor="middle" font-size="10" fill="#77716C">Intermediário</text><rect x="180" width="80" height="22" rx="11" fill="#fff" stroke="#E9E4DE"/><text x="220" y="15" text-anchor="middle" font-size="10" fill="#77716C">60 minutos</text><rect x="268" width="82" height="22" rx="11" fill="#fff" stroke="#E9E4DE"/><text x="309" y="15" text-anchor="middle" font-size="10" fill="#77716C">Equilibrada</text></g><text x="875" y="32" font-size="11" font-weight="600" fill="#5F7F67">●  Salva automaticamente</text><line y1="146" x2="840" y2="146" stroke="#E9E4DE"/><text y="180" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9A4F3D">OBJETIVOS DE APRENDIZAGEM</text><text y="216" font-family="Georgia,serif" font-size="24">Ao final da aula, os alunos serão capazes de:</text><rect y="236" width="840" height="34" rx="8" fill="#F3EDE4"/><text x="14" y="258" font-size="11">✓  Compartilhar experiências de viagem usando frases no present perfect.</text><rect y="278" width="840" height="34" rx="8" fill="#F3EDE4"/><text x="14" y="300" font-size="11">✓  Reconhecer e aplicar vocabulário relacionado a viagens e destinos.</text><rect y="320" width="840" height="34" rx="8" fill="#F3EDE4"/><text x="14" y="342" font-size="11">✓  Fazer perguntas de acompanhamento para manter uma conversa.</text><text y="397" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9A4F3D">SEQUÊNCIA DIDÁTICA</text><text y="433" font-family="Georgia,serif" font-size="24">Atividades</text><g transform="translate(0 452)"><rect width="840" height="86" rx="12" fill="#fff" stroke="#E9E4DE"/><text x="16" y="23" font-size="10" font-weight="700" letter-spacing="1" fill="#9A4F3D">01 · AQUECIMENTO</text><text x="770" y="23" text-anchor="end" font-size="10" fill="#77716C">10 minutos</text><text x="16" y="50" font-family="Georgia,serif" font-size="19">Have you ever…?</text><text x="16" y="72" font-size="11" fill="#77716C">Apresente três imagens de destinos e convide os alunos a responderem usando frases curtas.</text></g><g transform="translate(0 550)"><rect width="840" height="86" rx="12" fill="#fff" stroke="#E9E4DE"/><text x="16" y="23" font-size="10" font-weight="700" letter-spacing="1" fill="#9A4F3D">02 · VOCABULÁRIO</text><text x="770" y="23" text-anchor="end" font-size="10" fill="#77716C">15 minutos</text><text x="16" y="50" font-family="Georgia,serif" font-size="19">Travel stories map</text><text x="16" y="72" font-size="11" fill="#77716C">Em duplas, conecte cartões de vocabulário a situações de viagem.</text></g></g><g transform="translate(1150 110)" font-family="Inter,Arial,sans-serif"><rect width="210" height="610" rx="16" fill="#F8EEE8" stroke="#E6C8BA"/><rect x="18" y="20" width="30" height="30" rx="10" fill="#F9DFC1"/><text x="33" y="41" text-anchor="middle" font-size="17" fill="#D9823B">✦</text><text x="60" y="36" font-size="13" font-weight="600" fill="#3B2923">Assistente de IA</text><text x="60" y="51" font-size="9" fill="#77716C">Refine a aula com segurança</text><text x="18" y="82" font-size="11" fill="#4A4643">O que você gostaria de melhorar?</text><g font-size="10" font-weight="600" fill="#9A4F3D"><rect x="18" y="105" width="174" height="36" rx="8" fill="#fff" stroke="#E6C8BA"/><text x="29" y="127">Tornar mais interativa  →</text><rect x="18" y="149" width="174" height="36" rx="8" fill="#fff" stroke="#E6C8BA"/><text x="29" y="171">Criar exercício de fala  →</text><rect x="18" y="193" width="174" height="36" rx="8" fill="#fff" stroke="#E6C8BA"/><text x="29" y="215">