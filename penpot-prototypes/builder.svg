<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#FAF7F2"/><rect width="240" height="900" fill="#F3EDE4"/><line x1="240" y1="0" x2="240" y2="900" stroke="#E9E4DE"/><line x1="240" y1="76" x2="1440" y2="76" stroke="#E9E4DE"/>
  <g font-family="Inter,Arial,sans-serif" fill="#3B2923"><rect x="32" y="30" width="34" height="34" rx="11" fill="#B85C47"/><path d="M42 56V38h14v18M39 43h20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text x="78" y="51" font-size="16" font-weight="700">Gerador de Aulas</text><text x="32" y="113" font-size="10" font-weight="700" letter-spacing="1.5" fill="#77716C">WORKSPACE</text><rect x="16" y="188" width="208" height="42" rx="8" fill="#E9D4CB"/><g font-size="13"><text x="54" y="162" fill="#4A4643">Visão geral</text><text x="54" y="214" fill="#9A4F3D" font-weight="600">Criar aula</text><text x="54" y="266" fill="#4A4643">Banco de questões</text><text x="54" y="318" fill="#4A4643">Configurações</text></g><g fill="none" stroke="#77716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="149" width="15" height="15" rx="2"/><path d="M31 159h11M36 153v8"/><path d="M36 247v18M27 256h18"/><path d="M29 298h14v20H29zM32 302h8M32 307h8"/><path d="M29 350h15M31 346v20M42 346v20"/></g><line x1="32" y1="730" x2="208" y2="730" stroke="#D8CEC5"/><text x="32" y="764" font-size="11" fill="#77716C">Plano Professor</text><text x="194" y="764" text-anchor="end" font-size="11" fill="#77716C">44%</text><rect x="32" y="777" width="176" height="5" rx="3" fill="#DFD3C8"/><rect x="32" y="777" width="78" height="5" rx="3" fill="#D9823B"/><circle cx="48" cy="850" r="16" fill="#DFC0B1"/><text x="48" y="854" text-anchor="middle" font-size="11" font-weight="700" fill="#9A4F3D">IS</text><text x="74" y="849" font-size="12" font-weight="600">Isabela Santos</text><text x="74" y="867" font-size="10" fill="#77716C">Professora de inglês</text><text x="280" y="45" font-size="12" fill="#77716C">Workspace</text><text x="348" y="45" font-size="12" fill="#CFC7BF">/</text><text x="365" y="45" font-size="12" font-weight="600">Criar aula</text><circle cx="1354" cy="38" r="17" fill="#B85C47"/><text x="1354" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">IS</text></g>
  <g transform="translate(280 112)" font-family="Inter,Arial,sans-serif"><text y="0" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9A4F3D">CRIAR AULA</text><text y="50" font-family="Georgia,serif" font-size="42" fill="#3B2923">Vamos preparar algo bom.</text><text y="82" font-size="14" fill="#77716C">Conte o essencial sobre a sua turma. A IA organiza o restante em uma aula pronta para você revisar.</text><rect x="880" y="16" width="176" height="38" rx="10" fill="#fff" stroke="#E9E4DE"/><rect x="884" y="20" width="83" height="30" rx="8" fill="#F3EDE4"/><text x="925" y="39" text-anchor="middle" font-size="11" font-weight="600" fill="#9A4F3D">Fast</text><text x="1016" y="39" text-anchor="middle" font-size="11" fill="#77716C">Criativo</text></g>
  <g transform="translate(280 235)" font-family="Inter,Arial,sans-serif"><g fill="#77716C" font-size="11"><circle cx="11" cy="9" r="11" fill="#B85C47"/><text x="11" y="13" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="34" y="13" fill="#3B2923" font-weight="600">Contexto</text><line x1="11" y1="28" x2="11" y2="61" stroke="#E9E4DE"/><circle cx="11" cy="74" r="11" fill="#FAF7F2" stroke="#CFC7BF"/><text x="11" y="78" text-anchor="middle">2</text><text x="34" y="78">Objetivos</text><line x1="11" y1="93" x2="11" y2="126" stroke="#E9E4DE"/><circle cx="11" cy="139" r="11" fill="#FAF7F2" stroke="#CFC7BF"/><text x="11" y="143" text-anchor="middle">3</text><text x="34" y="143">Materiais</text><line x1="11" y1="158" x2="11" y2="191" stroke="#E9E4DE"/><circle cx="11" cy="204" r="11" fill="#FAF7F2" stroke="#CFC7BF"/><text x="11" y="208" text-anchor="middle">4</text><text x="34" y="208">Geração</text></g>
    <g transform="translate(178 0)"><text y="17" font-family="Georgia,serif" font-size="24" fill="#3B2923">Sobre esta aula</text><text y="41" font-size="11" fill="#77716C">Comece pelo conteúdo que os estudantes precisam encontrar.</text><text x="680" y="17" font-size="10" fill="#77716C">01 / 04</text><text y="80" font-size="12" font-weight="600">Disciplina</text><rect y="91" width="318" height="40" rx="8" fill="#fff" stroke="#CFC7BF"/><text x="14" y="116" font-size="12">Inglês</text><text x="295" y="116" font-size="13" fill="#77716C">⌄</text><text x="340" y="80" font-size="12" font-weight="600">Tema da aula</text><rect x="340" y="91" width="340" height="40" rx="8" fill="#fff" stroke="#CFC7BF"/><text x="354" y="116" font-size="12">Travel experiences</text><text y="162" font-size="12" font-weight="600">O que você quer ensinar?</text><rect y="173" width="680" height="75" rx="8" fill="#fff" stroke="#CFC7BF"/><text x="14" y="198" font-size="11" fill="#4A4643">Quero trabalhar experiências de viagem e usar o present perfect</text><text x="14" y="218" font-size="11" fill="#4A4643">para que os alunos compartilhem histórias pessoais.</text><text y="269" font-size="10" fill="#77716C">Uma ou duas frases já são suficientes no modo Fast.</text><line y1="304" x2="680" y2="304" stroke="#E9E4DE"/><text y="339" font-family="Georgia,serif" font-size="24" fill="#3B2923">Quem são seus alunos?</text><text y="363" font-size="11" fill="#77716C">Ajuste o nível e o tempo disponível para a aula.</text><text x="680" y="339" text-anchor="end" font-size="10" fill="#77716C">02 / 04</text><text y="401" font-size="12" font-weight="600">Nível da turma</text><g transform="translate(0 413)"><rect width="160" height="39" rx="8" fill="#fff" stroke="#E9E4DE"/><rect x="172" width="160" height="39" rx="8" fill="#fff" stroke="#E9E4DE"/><rect x="344" width="160" height="39" rx="8" fill="#F8EBE5" stroke="#B85C47"/><rect x="516" width="164" height="39" rx="8" fill="#fff" stroke="#E9E4DE"/><text x="80" y="24" text-anchor="middle" font-size="11" fill="#77716C">Iniciante</text><text x="252" y="24" text-anchor="middle" font-size="11" fill="#77716C">Básico</text><text x="424" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#9A4F3D">Intermediário</text><text x="598" y="24" text-anchor="middle" font-size="11" fill="#77716C">Avançado</text></g><text y="493" font-size="12" font-weight="600">Duração</text><rect y="504" width="318" height="40" rx="8" fill="#fff" stroke="#CFC7BF"/><text x="14" y="529" font-size="12">60 minutos</text><text x="295" y="529" font-size="13" fill="#77716C">⌄</text><text x="340" y="493" font-size="12" font-weight="600">Quantidade de alunos</text><rect x="340" y="504" width="340" height="40" rx="8" fill="#fff" stroke="#CFC7BF"/><text x="354" y="529" font-size="12">11–20 alunos</text><text x="657" y="529" font-size="13" fill="#77716C">⌄</text><rect y="573" width="680" height="1" fill="#E9E4DE"/><text y="609" font-family="Georgia,serif" font-size="24" fill="#3B2923">Objetivos de aprendizagem</text><text y="632" font-size="11" fill="#77716C">Escolha até três resultados que devem aparecer na aula.</text><g font-size="11" fill="#4A4643"><text y="672">☑  Praticar conversação</text><text x="245" y="672">☑  Aprender vocabulário</text><text x="490" y="672">☐  Revisar gramática</text></g><rect x="536" y="702" width="144" height="40" rx="8" fill="#B85C47"/><text x="608" y="727" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">✦  Gerar minha aula</text></g></g>
</svg>
