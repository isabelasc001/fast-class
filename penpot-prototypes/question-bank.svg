 stroke="#E9E4DE"/><text x="20" y="31" font-size="13" font-weight="600" fill="#3B2923">Choose the best answer: “I have never ___ to Canada.”</text><text x="20" y="55" font-size="11" fill="#77716C">Questão de múltipla escolha para verificar uso do particípio passado.</text><rect x="20" y="72" width="56" height="20" rx="10" fill="#F9E2D4"/><text x="48" y="86" text-anchor="middle" font-size="9" font-weight="600" fill="#9A4F3D">INGLÊS</text><rect x="84" y="72" width="78" height="20" rx="10" fill="#fff" stroke="#E9E4DE"/><text x="123" y="86" text-anchor="middle" font-size="9" fill="#77716C">Gramática</text><rect x="170" y="72" width="72" height="20" rx="10" fill="#fff" stroke="#E9E4DE"/><text x="206" y="86" text-anchor="middle" font-size="9" fill="#77716C">Básico</text><text x="1050" y="39" text-anchor="end" font-size="16" fill="#77716C">⋯</text></g><g transform="translate(0 236)"><rect width="1100" height="104" rx="12" fill="#fff" stroke="#E9E4DE"/><text x="20" y="31" font-size="13" font-weight="600" fill="#3B2923">Tell a story about something you have learned recently.</text><text x="20" y="55" font-size="11" fill="#77716C">Questão de produção oral para conectar o conteúdo à vida do aluno.</text><rect x="20" y="72" width="56" height="20" rx="10" fill="#F9E2D4"/><text x="48" y="86" text-anchor="middle" font-size="9" font-weight="600" fill="#9A4F3D">INGLÊS</text><rect x="84" y="72" width="94" height="20" rx="10" fill="#fff" stroke="#E9E4DE"/><text x="131" y="86" text-anchor="middle" font-size="9" fill="#77716C">Produção oral</text><rect x="186" y="72" width="72" height="20" rx="10" fill="#fff" stroke="#E9E4DE"/><text x="222" y="86" text-anchor="middle" font-size="9" fill="#77716C">Avançado</text><text x="1050" y="39" text-anchor="end" font-size="16" fill="#77716C">⋯</text></g></g></g></svg>
