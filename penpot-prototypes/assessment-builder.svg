    <text x="54" y="318" font-size="13" fill="#4A4643">Configurações</text>
    <text x="32" y="764" font-size="11" fill="#77716C">Plano Professor</text>
    <rect x="32" y="777" width="176" height="5" rx="3" fill="#DFD3C8"/>
    <rect x="32" y="777" width="78" height="5" rx="3" fill="#D9823B"/>
    <circle cx="48" cy="850" r="16" fill="#DFC0B1"/>
    <text x="48" y="854" text-anchor="middle" font-size="11" font-weight="700" fill="#9A4F3D">IS</text>
    <text x="74" y="849" font-size="12" font-weight="600" fill="#3B2923">Isabela Santos</text>
    <text x="280" y="45" font-size="12" fill="#77716C">Banco de questões</text>
    <text x="410" y="45" font-size="12" fill="#CFC7BF">/</text>
    <text x="427" y="45" font-size="12" font-weight="600" fill="#3B2923">Montar avaliação</text>
    <circle cx="1354" cy="38" r="17" fill="#B85C47"/>
    <text x="1354" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">IS</text>
  </g>

  <g transform="translate(280 118)" font-family="Inter,Arial,sans-serif">
    <text y="0" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9A4F3D">MONTAGEM DA AVALIAÇÃO</text>
    <text y="50" font-family="Georgia,serif" font-size="42" fill="#3B2923">Montar prova ou atividade.</text>
    <text y="82" font-size="14" fill="#77716C">Dê um contexto para as 2 questões selecionadas antes de gerar o documento.</text>
    <rect x="868" y="-12" width="232" height="34" rx="17" fill="#F8EBE5"/>
    <circle cx="889" cy="5" r="8" fill="#B85C47"/>
    <path d="m885 5 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="906" y="9" font-size="11" font-weight="600" fill="#9A4F3D">2 questões selecionadas</text>

    <g transform="translate(0 130)">
      <rect width="720" height="604" rx="16" fill="#fff" stroke="#E9E4DE"/>
      <text x="28" y="38" font-size="10" font-weight="700" letter-spacing="1.1" fill="#9A4F3D">CONFIGURAÇÃO</text>
      <text x="28" y="72" font-family="Georgia,serif" font-size="24" fill="#3B2923">Como você quer aplicar?</text>
      <text x="28" y="98" font-size="11" fill="#77716C">Ajuste o formato e revise as questões antes de gerar.</text>

      <rect x="28" y="124" width="318" height="54" rx="10" fill="#F8EBE5" stroke="#B85C47" stroke-width="1.5"/>
      <text x="54" y="148" font-size="12" font-weight="700" fill="#9A4F3D">PROVA</text>
      <text x="54" y="164" font-size="10" fill="#9A4F3D">Avaliação individual</text>
      <rect x="356" y="124" width="318" height="54" rx="10" fill="#fff" stroke="#E9E4DE"/>
      <text x="382" y="148" font-size="12" font-weight="600" fill="#77716C">ATIVIDADE</text>
      <text x="382" y="164" font-size="10" fill="#A49C95">Prática em sala</text>

      <text x="28" y="218" font-size="11" font-weight="600" fill="#3B2923">Título do documento</text>
      <rect x="28" y="232" width="646" height="44" rx="8" fill="#fff" stroke="#CFC7BF"/>
      <text x="44" y="259" font-size="12" fill="#3B2923">Avaliação de Inglês · Present perfect</text>

      <text x="28" y="314" font-size="11" font-weight="600" fill="#3B2923">Instruções para a turma</text>
      <rect x="28" y="328" width="646" height="68" rx="8" fill="#fff" stroke="#CFC7BF"/>
      <text x="44" y="355" font-size="11" fill="#77716C">Leia cada questão com atenção e responda usando frases completas.</text>
      <text x="44" y="374" font-size="11" fill="#77716C">Revise sua resposta antes de entregar.</text>

      <line x1="28" y1="428" x2="674" y2="428" stroke="#E9E4DE"/>
      <text x="28" y="458" font-size="11" font-weight="600" fill="#3B2923">Questões selecionadas</text>
      <text x="674" y="458" text-anchor="end" font-size="10" fill="#A49C95">Arraste para reordenar</text>

      <rect x="28" y="476" width="646" height="58" rx="10" fill="#FCFAF7" stroke="#E9E4DE"/>
      <circle cx="54" cy="505" r="14" fill="#F8E5D8"/>
      <text x="54" y="509" text-anchor="middle" font-size="10" font-weight="700" fill="#9A4F3D">01</text>
      <text x="82" y="500" font-size="11" font-weight="600" fill="#3B2923">Have you ever visited another country?</text>
      <text x="82" y="517" font-size="10" fill="#77716C">Questão aberta · Conversação</text>
      <text x="644" y="510" text-anchor="end" font-size="18" fill="#A49C95">⋮⋮</text>

      <rect x="28" y="546" width="646" height="58" rx="10" fill="#FCFAF7" stroke="#E9E4DE"/>
      <circle cx="54" cy="575" r="14" fill="#F8E5D8"/>
      <text x="54" y="579" text-anchor="middle" font-size="10" font-weight="700" fill="#9A4F3D">02</text>
      <text x="82" y="570" font-size="11" font-weight="600" fill="#3B2923">Choose the best answer: “I have never ___ to Canada.”</text>
      <text x="82" y="587" font-size="10" fill="#77716C">Múltipla escolha · Gramática</text>
      <text x="644" y="580" text-anchor="end" font-size="18" fill="#A49C95">⋮⋮</text>
    </g>

    <g transform="translate(748 130)">
      <rect width="352" height="254" rx="16" fill="#fff" stroke="#E9E4DE"/>
      <text x="24" y="36" font-size="10" font-weight="700" letter-spacing="1.1" fill="#9A4F3D">RESUMO DO DOCUMENTO</text>
      <text x="24" y="72" font-family="Georgia,serif" font-size="24" fill="#3B2923">Avaliação de Inglês</text>
      <text x="24" y="98" font-size="11" fill="#77716C">Present perfect · 2 questões</text>
      <line x1="24" y1="120" x2="328" y2="120" stroke="#E9E4DE"/>
      <text x="24" y="150" font-size="11" fill="#77716C">Formato</text><text x="328" y="150" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">Prova</text>
      <text x="24" y="178" font-size="11" fill="#77716C">Duração sugerida</text><text x="328" y="178" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">45 minutos</text>
      <text x="24" y="206" font-size="11" fill="#77716C">Saída</text><text x="328" y="206" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">PDF ou DOCX</text>
      <rect x="0" y="276" width="352" height="58" rx="10" fill="#B85C47"/>
      <path d="M25 294h16v21h-16zM29 290h8v4h-8zM28 299h10M28 305h10M28 311h7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="176" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Gerar documento</text>
      <text x="0" y="360" font-size="10" fill="#A49C95">Você poderá revisar o documento antes de exportar.</text>
