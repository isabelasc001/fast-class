      <text x="24" y="154" font-size="11" fill="#77716C">Formato</text><text x="304" y="154" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">Prova</text>
      <text x="24" y="181" font-size="11" fill="#77716C">Questões</text><text x="304" y="181" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">2 selecionadas</text>
      <text x="24" y="208" font-size="11" fill="#77716C">Duração</text><text x="304" y="208" text-anchor="end" font-size="11" font-weight="600" fill="#3B2923">45 minutos</text>
      <rect x="0" y="272" width="328" height="58" rx="10" fill="#B85C47"/>
      <text x="164" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Continuar revisão</text>
      <text x="0" y="356" font-size="10" fill="#A49C95">Edite a montagem se precisar ajustar alguma questão.</text>
      <rect x="0" y="392" width="328" height="102" rx="16" fill="#F8EBE5"/>
      <text x="24" y="425" font-size="10" font-weight="700" letter-spacing="1.0" fill="#9A4F3D">PRÓXIMA ETAPA</text>
      <text x="24" y="454" font-size="12" font-weight="600" fill="#3B2923">Exportar e compartilhar</text>
      <text x="24" y="476" font-size="10" fill="#77716C">Escolha PDF para impressão ou DOCX</text>
      <text x="24" y="491" font-size="10" fill="#77716C">para continuar editando o documento.</text>
