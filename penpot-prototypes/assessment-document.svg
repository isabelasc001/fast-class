      <text x="80" y="207" font-size="11" font-weight="600" fill="#3B2923">Instruções</text>
      <text x="80" y="230" font-size="10" fill="#77716C">Leia cada questão com atenção e responda usando frases completas.</text>
      <text x="80" y="247" font-size="10" fill="#77716C">Revise sua resposta antes de entregar.</text>

      <text x="80" y="292" font-size="11" font-weight="700" fill="#9A4F3D">01</text>
      <text x="114" y="292" font-size="11" font-weight="600" fill="#3B2923">Have you ever visited another country?</text>
      <text x="114" y="313" font-size="10" fill="#77716C">Explain where and when. Use at least two complete sentences.</text>
