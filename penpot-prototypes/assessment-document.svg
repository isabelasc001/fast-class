      <line x1="114" y1="376" x2="648" y2="376" stroke="#CFC7BF"/>
      <line x1="114" y1="404" x2="648" y2="404" stroke="#CFC7BF"/>

      <text x="80" y="450" font-size="11" font-weight="700" fill="#9A4F3D">02</text>
      <text x="114" y="450" font-size="11" font-weight="600" fill="#3B2923">Choose the best answer:</text>
      <text x="114" y="472" font-size="10" fill="#77716C">“I have never ___ to Canada.”</text>
      <text x="114" y="508" font-size="10" fill="#3B2923">(   ) go</text><text x="244" y="508" font-size="10" fill="#3B2923">(   ) went</text><text x="374" y="508" font-size="10" fill="#3B2923">(   ) been</text><text x="504" y="508" font-size="10" fill="#3B2923">(   ) going</text>
